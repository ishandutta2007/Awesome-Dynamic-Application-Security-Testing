<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes rotateRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .radar-sweep { transform-origin: 1000px 160px; animation: rotateRadar 10s linear infinite; }
      .pulse-bg { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,40 L 1200,40 M 0,80 L 1200,80 M 0,120 L 1200,120 M 0,160 L 1200,160 M 0,200 L 1200,200 M 0,240 L 1200,240 M 0,280 L 1200,280" />
    <path d="M 100,0 L 100,320 M 200,0 L 200,320 M 300,0 L 300,320 M 400,0 L 400,320 M 500,0 L 500,320 M 600,0 L 600,320 M 700,0 L 700,320 M 800,0 L 800,320 M 900,0 L 900,320 M 1000,0 L 1000,320 M 1100,0 L 1100,320" />
  </g>

  <!-- Dynamic Radar Background Graphic (Plausible security visual on right side) -->
  <g opacity="0.25">
    <circle cx="1000" cy="160" r="110" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="1000" cy="160" r="75" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="1000" cy="160" r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="880" y1="160" x2="1120" y2="160" stroke="#475569" stroke-width="1" />
    <line x1="1000" y1="40" x2="1000" y2="280" stroke="#475569" stroke-width="1" />
    <g class="radar-sweep">
      <path d="M 1000,160 L 1110,160 A 110,110 0 0,0 1000,50 Z" fill="url(#glowGrad)" />
    </g>
    <!-- Detected target blips -->
    <circle cx="1040" cy="120" r="4" fill="#ec4899" filter="url(#glow)" />
    <circle cx="960" cy="190" r="3" fill="#38bdf8" />
    <circle cx="1010" cy="210" r="4" fill="#22c55e" />
  </g>

  <!-- Glowing Accent Line Top Border -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Foreground Content Block -->
  <!-- Tag / Pill -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
    <text x="26" y="18" class="badge-text">🛡️ SEC-OPS &amp; DEVSECOPS</text>
  </g>

  <!-- Title -->
  <text x="60" y="130" class="title">Awesome Dynamic Application</text>
  <text x="60" y="180" class="title" fill="url(#accentGrad)">Security Testing (DAST)</text>

  <!-- Subtitle -->
  <text x="60" y="222" class="subtitle">Curated list of DAST tools, runtime scanners, API security &amp; open-source projects</text>

  <!-- Tech Badges Bottom Row -->
  <g transform="translate(60, 252)">
    <rect x="0" y="0" width="110" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="12" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ Runtime Scan</text>

    <rect x="120" y="0" width="110" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="132" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🔑 API Security</text>

    <rect x="240" y="0" width="110" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="252" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🚀 CI/CD Ready</text>

    <rect x="360" y="0" width="110" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="372" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🌐 Open-Source</text>
  </g>
</svg>
